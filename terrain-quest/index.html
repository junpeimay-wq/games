<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗺️ まちの地図記号クイズ - GAME ARCADE</title>
  <meta name="description" content="国土地理院の地図で記号を選び、4択クイズに挑戦。初めて正解した記号は高得点、Google認証なしでもスコアを端末に保存できます。">
  <link rel="canonical" href="https://junpeimay-wq.github.io/games/terrain-quest/">
  <link rel="icon" type="image/png" sizes="96x96" href="../favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="https://gsi-cyberjapan.github.io/optimal_bvmap/lib/maplibre-gl@2.4.0/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header">
      <a href="../index.html">← GAME ARCADE</a>
      <a href="../ranking/terrain-quest.html">🏆 地図記号クイズのランキング</a>
      <h1>🗺️ まちの地図記号クイズ</h1>
    </header>

    <section class="game-panel" aria-label="まちの地図記号クイズ">
      <p id="game-message" class="game-message" aria-live="polite"></p>

      <div class="quiz-progress score-bar" aria-label="現在のスコア">
        <div class="score-summary">
          <span id="quiz-count">0問</span>
          <button id="mastered-symbols-button" class="mastered-symbols-button" type="button"
            aria-haspopup="dialog" aria-controls="mastered-symbols-dialog">正解した記号 0種</button>
        </div>
        <span id="quiz-score">累計 0点</span>
      </div>

      <section class="gps-panel" aria-labelledby="gps-title">
        <h2 id="gps-title">地図記号を見つけよう</h2>
        <div class="map-controls">
          <button id="locate-button" class="locate-button" type="button">現在地の地図を表示</button>
          <button id="return-to-location" class="return-to-location" type="button" hidden>
            ◎ 現在地へ戻る
          </button>
        </div>
        <p id="location-status" class="location-status" role="status" aria-live="polite"></p>
        <p class="location-privacy-note">現在地は地図表示だけに使い、保存しません。</p>
        <a id="location-map-link" class="location-map-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
          選択した場所を国土地理院地図で開く ↗
        </a>
        <figure id="location-map-preview" class="location-map-preview" hidden>
          <div class="location-map-frame">
            <div id="symbol-map" role="application" aria-label="現在地周辺の国土地理院ベクトル地図"></div>
          </div>
        </figure>
      </section>

      <section id="quiz-panel" class="quiz-panel" aria-label="地図記号クイズ" hidden>
        <p id="quiz-record" class="quiz-record"></p>
        <p id="quiz-record-status" class="quiz-record-status" role="status" aria-live="polite"></p>
        <p id="quiz-question" class="quiz-question"></p>
        <div id="quiz-choices" class="quiz-choices"></div>
        <p id="quiz-feedback" class="quiz-feedback" aria-live="polite"></p>
        <button id="next-question" class="next-question" type="button" hidden>次の問題へ</button>
      </section>
    </section>

    <dialog id="mastered-symbols-dialog" class="mastered-symbols-dialog"
      aria-labelledby="mastered-symbols-title">
      <div class="mastered-symbols-dialog-header">
        <h2 id="mastered-symbols-title">正解した地図記号</h2>
        <span id="mastered-symbols-count"></span>
        <button id="close-mastered-symbols" class="close-mastered-symbols" type="button"
          aria-label="閉じる">×</button>
      </div>
      <ul id="mastered-symbols-list" class="mastered-symbols-list"></ul>
    </dialog>

    <footer class="credits">
      <p>地図・記号データ：<a href="https://maps.gsi.go.jp/development/vt.html" target="_blank" rel="noopener noreferrer">国土地理院 最適化ベクトルタイル</a></p>
      <p>位置情報は地図表示にのみ使用し、ゲームやFirestoreには保存しません。</p>
    </footer>
  </main>
  <script src="https://gsi-cyberjapan.github.io/optimal_bvmap/lib/maplibre-gl@2.4.0/maplibre-gl.js"></script>
  <script src="https://gsi-cyberjapan.github.io/optimal_bvmap/lib/pmtiles@2.10.0/index.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
