<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏆 ゲーム別ランキング - GAME ARCADE</title>
  <meta name="description" content="スネーク、戦略的〇×ゲーム、ブロックパズル、地図記号クイズのゲーム別ランキング。各ゲームの上位3人のスコアを一覧し、個別ページでトップ10を確認できます。">
  <link rel="canonical" href="https://junpeimay-games.web.app/ranking/">
  <link rel="icon" type="image/png" sizes="96x96" href="../favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="ranking.css">
</head>
<body>
  <header>
    <h1>🏆 ゲーム別ランキング</h1>

      <a href="../index.html">GAME ARCADE</a>

  </header>
  <main>
    <p class="intro">採点基準が異なるため、ランキングはゲームごとに表示します。</p>
    <section class="game-ranking" data-game="snake">
      <header class="game-ranking-header">

        <a href="snake.html">Top 10 →</a>

        <li class="empty">読み込み中...</li>
      </ol>
    </section>
    <section class="game-ranking" data-game="tictactoe">
      <header class="game-ranking-header">
        <h2>⭕ 戦略的〇×ゲーム Top 3（連勝数）</h2>
        <a href="tictactoe.html">Top 10 →</a>
      </header>
      <ol class="ranking-list" aria-label="〇×ゲーム Top 3">
        <li class="empty">読み込み中...</li>
      </ol>

    <section class="game-ranking" data-game="block-puzzle">
      <header class="game-ranking-header">
        <h2>🧩 8x8ブロックパズル Top 3</h2>
        <a href="block-puzzle.html">Top 10 →</a>
      </header>
      <ol class="ranking-list" aria-label="ブロックパズル Top 3">
        <li class="empty">読み込み中...</li>
      </ol>
    </section>
    <section class="game-ranking" data-game="terrain-quest">
      <header class="game-ranking-header">
        <h2>🗺️ まちの地図記号クイズ Top 3（累計スコア）</h2>
        <a href="terrain-quest.html">Top 10 →</a>
      </header>
      <ol class="ranking-list" aria-label="地図記号クイズ Top 3">
        <li class="empty">読み込み中...</li>
      </ol>
    </section>
    <p id="ranking-error" class="error" role="status"></p>
  </main>
  <script type="module" src="index.js"></script>

</html>
