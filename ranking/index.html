<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏆 ゲーム別ランキング - GAME ARCADE</title>
  <link rel="stylesheet" href="ranking.css">
</head>
<body>
  <header>
    <h1>🏆 ゲーム別ランキング</h1>
    <a href="../index.html">← アーケードへ戻る</a>
  </header>
  <main>
    <p class="intro">採点基準が異なるため、ランキングはゲームごとに表示します。</p>
    <section class="game-ranking" data-game="snake">
      <header class="game-ranking-header">
        <h2>🐍 スネークゲーム Top 3</h2>
        <a href="snake.html">Top 10 →</a>
      </header>
      <ol class="ranking-list" aria-label="スネークゲーム Top 3">
        <li class="empty">読み込み中...</li>
      </ol>
    </section>
    <section class="game-ranking" data-game="tictactoe">
      <header class="game-ranking-header">
        <h2>❌⭕ 〇×ゲーム Top 3（連勝数）</h2>
        <a href="tictactoe.html">Top 10 →</a>
      </header>
      <ol class="ranking-list" aria-label="〇×ゲーム Top 3">
        <li class="empty">読み込み中...</li>
      </ol>
    </section>
    <section class="game-ranking" data-game="block-puzzle">
      <header class="game-ranking-header">
        <h2>🧩 ブロックパズル Top 3</h2>
        <a href="block-puzzle.html">Top 10 →</a>
      </header>
      <ol class="ranking-list" aria-label="ブロックパズル Top 3">
        <li class="empty">読み込み中...</li>
      </ol>
    </section>
    <p id="ranking-error" class="error" role="status"></p>
  </main>
  <script type="module" src="index.js"></script>
</body>
</html>
