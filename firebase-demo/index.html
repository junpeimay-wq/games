<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FDT7JTRCNE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FDT7JTRCNE');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏆 グローバルランキング - GAME ARCADE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🏆 グローバルランキング</h1>
    <a class="back-link" href="../index.html">← アーケードへ戻る</a>
    <a class="back-link" href="../ranking/index.html">ゲーム別ランキング</a>
  </header>

  <!-- 認証エリア -->
  <section class="auth-section">
    <button id="login-btn" class="btn btn-login">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Googleでログイン
    </button>
    <div id="user-info" class="user-info hidden">
      <img id="user-avatar" class="user-avatar" src="" alt="">
      <span id="user-name"></span>
      <button id="logout-btn" class="btn btn-logout">ログアウト</button>
    </div>
  </section>

  <!-- ゲーム本編からのスコア自動送信を確認するための共通基盤 -->
  <section class="submit-section">
    <h2>ゲームスコアの記録</h2>
    <p>スコアは各ゲームでハイスコアを更新したときに自動で送信されます。手入力はできません。記録にはGoogle認証が必要です。</p>
    <p id="ranking-status" class="submit-msg" aria-live="polite"></p>
  </section>

  <!-- ランキングエリア -->
  <section class="ranking-section">
    <div class="ranking-header">
      <h2>TOP 10</h2>
      <select id="filter-game" class="input-field filter-select">
        <option value="snake">🐍 スネーク</option>
        <option value="tictactoe">❌⭕ 〇×ゲーム</option>
        <option value="block-puzzle">🧩 ブロックパズル</option>
      </select>
    </div>
    <ul id="ranking-list" class="ranking-list">
      <li class="empty">読み込み中...</li>
    </ul>
  </section>

  <!-- Firebase game.js を type="module" で読み込む -->
  <script type="module" src="game.js"></script>
</body>
</html>
