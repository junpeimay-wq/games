  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐍 スネークゲーム</title>
  <meta name="description" content="矢印キー・WASD・画面の方向ボタンやスワイプで遊ぶスネークゲーム。エサを取ってスコアを伸ばし、壁や自分にぶつからないように進もう。">
  <link rel="canonical" href="https://junpeimay-wq.github.io/games/snake/">
  <link rel="icon" type="image/png" sizes="96x96" href="../favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../firebase-demo/shared-score.css">
</head>
<body>
  <main>
  <h1>🐍 スネークゲーム</h1>
  <div id="info">スコア: <span id="score">0</span>　最高: <span id="best">0</span></div>
  <a class="ranking-link" href="../ranking/snake.html">🏆 ランキング</a>
  <p id="ranking-status" class="ranking-status" aria-live="polite"></p>
  <canvas id="c" width="400" height="400"></canvas>
  <div id="msg">タップ or スペースでスタート</div>
  <div id="dpad">
    <div class="dpad-row">
      <button id="btn-up">▲</button>
    </div>
    <div class="dpad-row">
      <button id="btn-left">◀</button>
      <button id="btn-down">▼</button>
      <button id="btn-right">▶</button>
    </div>
  </div>
  <section class="game-guide" aria-labelledby="game-guide-title">
    <h2 id="game-guide-title">遊び方</h2>
    <p>ヘビを動かして赤いエサを食べると10点加算され、体が長くなります。壁または自分の体にぶつかるとゲームオーバーです。</p>
    <p>PCでは矢印キーまたはWASD、スマートフォンでは画面の方向ボタンかスワイプで操作します。自己ベストを更新するとローカルに保存され、Google認証済みの場合はランキングにも自動記録されます。</p>
  </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
