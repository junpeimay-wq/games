<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🐍 スネークゲーム</title>
<style>
  body { margin: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: #eee; }
  h1 { margin: 0 0 10px; font-size: 1.5rem; color: #00ff88; }
  #info { margin-bottom: 8px; font-size: 1rem; }
  canvas { border: 2px solid #00ff88; background: #16213e; }
  #msg { margin-top: 12px; font-size: 1.1rem; color: #ff6b6b; min-height: 1.5em; }
</style>
</head>
<body>
<h1>🐍 スネークゲーム</h1>
<div id="info">スコア: <span id="score">0</span>　最高: <span id="best">0</span></div>
<canvas id="c" width="400" height="400"></canvas>
<div id="msg">スペース or クリックでスタート</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const SZ=20,COLS=20,ROWS=20;
let snake,dir,nextDir,food,score,best=0,running=false,loop;

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; placeFood(); draw();
}

function placeFood(){
  do{ food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
  }while(snake.some(s=>s.x===food.x&&s.y===food.y));
}

function step(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    clearInterval(loop); running=false;
    best=Math.max(best,score);
    document.getElementById('best').textContent=best;
    document.getElementById('msg').textContent='💀 ゲームオーバー！スペース or クリックで再スタート';
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10; document.getElementById('score').textContent=score;
    placeFood();
  } else snake.pop();
  draw();
}

function draw(){
  ctx.fillStyle='#16213e'; ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#ff6b6b';
  ctx.beginPath(); ctx.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2-2,0,Math.PI*2); ctx.fill();
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?'#00ff88':'#00cc66';
    ctx.fillRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2);
  });
}

function start(){
  if(running) return;
  running=true;
  document.getElementById('msg').textContent='';
  document.getElementById('score').textContent=0;
  init();
  loop=setInterval(step,120);
}

document.addEventListener('keydown',e=>{
  const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
             w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  if(e.key===' '){ e.preventDefault(); start(); return; }
  const nd=map[e.key];
  if(nd&&!(nd.x===-dir.x&&nd.y===-dir.y)){ e.preventDefault(); nextDir=nd; }
});
C.addEventListener('click',start);

init();
</script>
</body>
</html>
