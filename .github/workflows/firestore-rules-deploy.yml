name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - firebase-demo/firestore.rules
      - firebase-demo/firestore.indexes.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-deploy
  cancel-in-progress: false

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase-demo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install firebase-demo dependencies
        working-directory: firebase-demo
        run: npm ci

      # Gate: the firebase-demo suite includes the Firestore emulator rules
      # tests (AGENTS.md / ADR-0002). If this step fails, the deploy steps
      # below never run.
      - name: Run firebase-demo tests
        working-directory: firebase-demo
        run: npm test

      - name: Install firebase-tools
        run: npm install --global firebase-tools@13.35.1

      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JUNPEIMAY_GAMES }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only firestore:rules,firestore:indexes --project junpeimay-games --non-interactive
