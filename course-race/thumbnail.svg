<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#386e34"/>
  <!-- Grass checker -->
  <g fill="#3f7a3a">
    <rect x="0" y="0" width="100" height="100"/><rect x="200" y="0" width="100" height="100"/>
    <rect x="400" y="0" width="100" height="100"/><rect x="600" y="0" width="100" height="100"/>
    <rect x="800" y="0" width="100" height="100"/><rect x="1000" y="0" width="100" height="100"/>
    <rect x="100" y="100" width="100" height="100"/><rect x="300" y="100" width="100" height="100"/>
    <rect x="500" y="100" width="100" height="100"/><rect x="700" y="100" width="100" height="100"/>
    <rect x="900" y="100" width="100" height="100"/><rect x="1100" y="100" width="100" height="100"/>
    <rect x="0" y="200" width="100" height="100"/><rect x="200" y="200" width="100" height="100"/>
    <rect x="400" y="200" width="100" height="100"/><rect x="600" y="200" width="100" height="100"/>
    <rect x="800" y="200" width="100" height="100"/><rect x="1000" y="200" width="100" height="100"/>
  </g>
  <!-- Road: an S-shaped course -->
  <g fill="#4c4c58">
    <rect x="60" y="380" width="500" height="90"/>
    <rect x="470" y="210" width="90" height="260"/>
    <rect x="470" y="210" width="560" height="90"/>
  </g>
  <g fill="#5d5d6e">
    <rect x="68" y="388" width="484" height="74"/>
    <rect x="478" y="218" width="74" height="244"/>
    <rect x="478" y="218" width="544" height="74"/>
  </g>
  <!-- Start -->
  <rect x="75" y="395" width="60" height="60" fill="#37b24d"/>
  <text x="105" y="432" font-family="monospace" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">START</text>
  <!-- Goal checker -->
  <g>
    <rect x="945" y="225" width="60" height="60" fill="#ffffff"/>
    <rect x="945" y="225" width="15" height="15" fill="#222222"/><rect x="975" y="225" width="15" height="15" fill="#222222"/>
    <rect x="960" y="240" width="15" height="15" fill="#222222"/><rect x="990" y="240" width="15" height="15" fill="#222222"/>
    <rect x="945" y="255" width="15" height="15" fill="#222222"/><rect x="975" y="255" width="15" height="15" fill="#222222"/>
    <rect x="960" y="270" width="15" height="15" fill="#222222"/><rect x="990" y="270" width="15" height="15" fill="#222222"/>
    <rect x="945" y="225" width="60" height="60" fill="none" stroke="#ffd23f" stroke-width="4"/>
  </g>
  <!-- Star on the road -->
  <polygon points="700,232 709,250 728,251 714,263 718,282 700,272 682,282 686,263 672,251 691,250" fill="#ffd23f"/>
  <!-- Boost pad -->
  <rect x="240" y="398" width="54" height="54" fill="#ff8c5a"/>
  <text x="267" y="438" font-family="monospace" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">»</text>
  <!-- Trees -->
  <g>
    <rect x="186" y="120" width="14" height="24" fill="#7a4a21"/>
    <rect x="160" y="70" width="66" height="58" fill="#2c5e2a"/>
    <rect x="172" y="56" width="42" height="30" fill="#3a7d37"/>
    <rect x="1070" y="420" width="14" height="24" fill="#7a4a21"/>
    <rect x="1044" y="370" width="66" height="58" fill="#2c5e2a"/>
    <rect x="1056" y="356" width="42" height="30" fill="#3a7d37"/>
  </g>
  <!-- Rock -->
  <rect x="690" y="420" width="70" height="46" fill="#8d8d99"/>
  <rect x="702" y="404" width="44" height="26" fill="#a8a8b5"/>
  <!-- Car (top view) -->
  <g transform="translate(515 425) rotate(90)">
    <rect x="-14" y="-30" width="12" height="10" fill="#222222"/><rect x="16" y="-30" width="12" height="10" fill="#222222"/>
    <rect x="-14" y="20" width="12" height="10" fill="#222222"/><rect x="16" y="20" width="12" height="10" fill="#222222"/>
    <rect x="-24" y="-34" width="48" height="68" fill="#e8452c"/>
    <rect x="-24" y="-34" width="48" height="12" fill="#b02a1a"/>
    <rect x="-14" y="-12" width="28" height="16" fill="#aee2ff"/>
    <rect x="14" y="-30" width="6" height="8" fill="#ffd23f"/><rect x="-20" y="-30" width="6" height="8" fill="#ffd23f"/>
  </g>
  <text x="600" y="620" font-family="monospace" font-size="52" font-weight="bold" fill="#ffd23f" text-anchor="middle">コースづくりレース</text>
</svg>
