<html lang="ja">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 GAME ARCADE</title>
  <meta name="description" content="ブラウザですぐ遊べる無料ゲーム集。スネーク、戦略的〇×ゲーム、8x8ブロックパズルを公開中。スマートフォンのタッチ操作やPCのキーボードに対応し、ゲーム別ランキングも楽しめます。">
  <link rel="canonical" href="https://junpeimay-wq.github.io/games/">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    main { width: 100%; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: monospace;
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      color: #00ff88;
      margin-bottom: 40px;
      letter-spacing: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: #16213e;
      border: 2px solid #00ff88;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,255,136,0.2);
    }
    .card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 14px 16px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: normal;
      color: #00ff88;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <main>
  <h1>🎮 GAME ARCADE</h1>
  <div class="grid">
    <a class="card" href="snake/index.html">
      <img src="snake/thumbnail.jpg" alt="スネークゲーム" width="1376" height="768" fetchpriority="high">
      <div class="card-body">
        <h2 class="card-title">🐍 スネークゲーム</h2>
        <div class="card-desc">矢印キー / WASD / スワイプで操作。食べ物を食べて長くなれ！</div>
      </div>
    </a>
    <a class="card" href="tictactoe/index.html">
      <img src="tictactoe/thumbnail.jpg" alt="戦略的〇×ゲーム" width="1376" height="768" loading="lazy" decoding="async">
      <div class="card-body">
        <h2 class="card-title">⭕ 戦略的〇×ゲーム</h2>
        <div class="card-desc">相手の駒を1回だけ上書きできる思考型マルバツゲーム！</div>
      </div>
    </a>
    <a class="card" href="block-puzzle/index.html">
      <img src="block-puzzle/thumbnail.jpg" alt="8x8ブロックパズル" width="1376" height="768" loading="lazy" decoding="async">
      <div class="card-body">
        <h2 class="card-title">🧩 8x8ブロックパズル</h2>
        <div class="card-desc">ブロックを配置して縦横ライン消去！同時消しボーナス付き！</div>
      </div>
    </a>
    <a class="card" href="ranking/index.html">
      <div class="card-body">
        <h2 class="card-title">🏆 ゲーム別ランキング</h2>
        <div class="card-desc">各ゲームのハイスコア・連勝数を見る</div>
      </div>
    </a>
  </div>
  </main>
</body>
</html>
